<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scripture Geography Game</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Georgia', serif;
      background-color: #f4ecd8;
    }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(244, 236, 216, 0.95);
      padding: 15px;
      border: 2px solid #8b5a2b;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    #map {
      width: 100vw;
      height: 100vh;
      background: #e2d2b4; /* Fallback parchment tone */
    }

    /* CSS Parchment Filter applied directly to map tiles */
    .parchment-tiles .leaflet-tile-pane {
      filter: sepia(0.65) hue-rotate(-15deg) contrast(1.15) brightness(0.92);
    }

    /* Text-only place label styling (No pins) */
    .map-text-label {
      background: transparent;
      border: none;
      box-shadow: none;
      font-family: 'Georgia', serif;
      font-weight: bold;
      font-size: 13px;
      color: #3e2723;
      text-shadow: 1px 1px 2px #f4ecd8, -1px -1px 2px #f4ecd8;
      white-space: nowrap;
    }

    .leaflet-tooltip-left::before, .leaflet-tooltip-right::before {
      display: none; /* Hide default Leaflet tooltip arrows */
    }
  </style>
</head>
<body>

<div id="controls">
  <h3>Scripture Location Challenge</h3>
  
  <label for="scopeSelect"><strong>Scope:</strong></label>
  <select id="scopeSelect" onchange="filterLocationsByScope()">
    <option value="all">All Locations</option>
    <option value="OT">Old Testament</option>
    <option value="NT">New Testament</option>
    <option value="Gospels">Gospels</option>
  </select>

  <br/><br/>
  <button onclick="nextTurn()">Pick Random Place</button>

  <div id="game-info" style="margin-top: 15px; max-width: 300px;">
    <strong>Target Place:</strong> <span id="target-place">---</span><br/>
    <strong>Verse Reference:</strong> <span id="target-verse">---</span>
  </div>
</div>

<div id="map" class="parchment-tiles"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Define Bible Book Categories
  const GOSPELS = ['Matt', 'Mark', 'Luke', 'John'];
  const NT_BOOKS = [...GOSPELS, 'Acts', 'Rom', '1Cor', '2Cor', 'Gal', 'Eph', 'Phil', 'Col', '1Thess', '2Thess', '1Tim', '2Tim', 'Titus', 'Phlm', 'Heb', 'Jas', '1Pet', '2Pet', '1John', '2John', '3John', 'Jude', 'Rev'];

  let map;
  let parsedLocations = [];
  let activeLocations = [];
  let mapLabelsLayer = L.layerGroup();

  // Initialize Map
  function initMap() {
    map = L.map('map', {
      minZoom: 5,
      maxZoom: 12
    });

    // Basemap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    mapLabelsLayer.addTo(map);
  }

  // Parse attached KML file content
  function parseKML(kmlText) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(kmlText, "text/xml");
    const folders = xmlDoc.getElementsByTagName("Folder");

    parsedLocations = [];

    for (let folder of folders) {
      const folderName = folder.getElementsByTagName("name")[0]?.textContent || "";
      const descText = folder.getElementsByTagName("description")[0]?.textContent || "";

      // Extract scripture references from description HTML/text
      const verses = Array.from(descText.matchAll(/([1-3]?\s?[A-Za-z]+)\s+(\d+:\d+)/g)).map(m => ({
        book: m[1].trim(),
        reference: `${m[1]} ${m[2]}`
      }));

      const placemarks = folder.getElementsByTagName("Placemark");
      
      for (let placemark of placemarks) {
        const name = placemark.getElementsByTagName("name")[0]?.textContent || folderName;

        // RULE: Ignore any location that has a confidence percentage in its name
        if (/% confidence/i.test(name) || /confidence/i.test(name)) {
          continue; 
        }

        // Parse Point coordinates (ignoring boundary display, but keeping spatial reference)
        const point = placemark.getElementsByTagName("Point")[0];
        if (point) {
          const coordsText = point.getElementsByTagName("coordinates")[0]?.textContent.trim();
          if (coordsText) {
            const [lng, lat] = coordsText.split(',').map(Number);
            
            parsedLocations.push({
              name: name.split('/')[0].trim(), // Clean primary location name
              lat: lat,
              lng: lng,
              verses: verses,
              // Boundaries/Polygons are excluded from map rendering per requirements
            });
          }
        }
      }
    }

    filterLocationsByScope();
    fitMapToAreaOfInterest();
  }

  // Restrict map bounds strictly to the Area of Interest
  function fitMapToAreaOfInterest() {
    if (parsedLocations.length === 0) return;
    const bounds = L.latLngBounds(parsedLocations.map(p => [p.lat, p.lng]));
    
    map.fitBounds(bounds, { padding: [50, 50] });
    map.setMaxBounds(bounds.pad(0.2)); // Restrict map panning strictly to this region
  }

  // Scope Filtering (OT, NT, Gospels, All)
  function filterLocationsByScope() {
    const scope = document.getElementById('scopeSelect').value;

    activeLocations = parsedLocations.filter(loc => {
      if (scope === 'all') return true;
      
      return loc.verses.some(v => {
        if (scope === 'Gospels') return GOSPELS.includes(v.book);
        if (scope === 'NT') return NT_BOOKS.includes(v.book);
        if (scope === 'OT') return !NT_BOOKS.includes(v.book);
        return v.book === scope;
      });
    });

    renderMapLabels();
  }

  // Render place names as direct text onto the map (No pins)
  function renderMapLabels() {
    mapLabelsLayer.clearLayers();

    activeLocations.forEach(loc => {
      // Create a invisible marker with a permanent text label attached
      const textLabel = L.marker([loc.lat, loc.lng], {
        icon: L.divIcon({
          className: 'map-text-label',
          html: loc.name,
          iconSize: [null, null]
        })
      });

      textLabel.addTo(mapLabelsLayer);
    });
  }

  // Select a random location and a random verse reference matching the active scope
  function nextTurn() {
    if (activeLocations.length === 0) {
      alert("No locations found for this selected scope.");
      return;
    }

    const randomLoc = activeLocations[Math.floor(Math.random() * activeLocations.length)];
    const randomVerse = randomLoc.verses.length > 0 
      ? randomLoc.verses[Math.floor(Math.random() * randomLoc.verses.length)].reference 
      : "Reference N/A";

    document.getElementById('target-place').innerText = randomLoc.name;
    document.getElementById('target-verse').innerText = randomVerse;

    // Smoothly focus near the chosen place
    map.flyTo([randomLoc.lat, randomLoc.lng], 8);
  }

  // Initialization
  initMap();

  // Load KML directly (Replace with your fetch mechanism or embedded string)
  // fetch('all.kml').then(res => res.text()).then(parseKML);
</script>
</body>
</html>
