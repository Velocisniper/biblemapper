<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BibleMapper Reader</title>
    <style>
        /* Modern CSS Reset & Core Styling */
        :root {
            --bg-color: #fcfbf9;
            --text-color: #2c2c2c;
            --primary-color: #2b4c7e;
            --verse-num-color: #768a9e;
            --border-color: #e2e2e2;
            --error-color: #d9534f;
            --max-width: 760px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --primary-color: #8ab4f8;
                --verse-num-color: #a0a0a0;
                --border-color: #333333;
                --error-color: #ff6b6b;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.8;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: var(--max-width);
        }

        /* Header Styling */
        header {
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
            letter-spacing: -0.02em;
        }

        /* Scripture Layout Styling */
        .chapter {
            margin-bottom: 3rem;
        }

        .chapter-title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 1.75rem;
            color: var(--primary-color);
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .chapter-text {
            font-size: 1.125rem;
            text-align: justify;
            margin: 0;
        }

        .verse {
            position: relative;
            margin-right: 0.15rem;
        }

        .verse-number {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.75em;
            font-weight: bold;
            color: var(--verse-num-color);
            vertical-align: super;
            line-height: 0;
            padding-right: 2px;
            user-select: none;
        }

        /* Utility States */
        .loading {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-style: italic;
            color: var(--verse-num-color);
        }

        .error {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--error-color);
            background-color: rgba(217, 83, 79, 0.1);
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid var(--error-color);
        }

        .error code {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.05);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BibleMapper</h1>
        </header>

        <main id="scripture-container">
            <!-- Dynamic Scripture Content Will Load Here -->
        </main>
    </div>

    <script>
        /**
         * BibleMapper Scripture Loader
         * Fetches JSON scripture data and renders it cleanly into the HTML container.
         */

        async function loadScripture(filePath) {
            const container = document.getElementById('scripture-container');
            
            try {
                // Display loading indicator
                container.innerHTML = '<p class="loading">Loading scripture text...</p>';

                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                renderScripture(data);

            } catch (error) {
                console.error("Error loading scripture data:", error);
                container.innerHTML = `
                    <div class="error">
                        <strong>Failed to load scripture content.</strong><br>
                        Please verify that the JSON file exists at path: <code>${filePath}</code>
                    </div>`;
            }
        }

        /**
         * Parses JSON structure and injects formatted HTML into DOM
         */
        function renderScripture(data) {
            const container = document.getElementById('scripture-container');
            container.innerHTML = ''; // Clear loading state

            if (!data || !Array.isArray(data.text)) {
                container.innerHTML = '<div class="error">Invalid or missing scripture data structure in JSON file.</div>';
                return;
            }

            // Loop through each chapter in data.text
            data.text.forEach(chapter => {
                const chapterElement = document.createElement('article');
                chapterElement.className = 'chapter';
                chapterElement.id = chapter.ID;

                // Chapter Title Header
                const titleElement = document.createElement('h2');
                titleElement.className = 'chapter-title';
                titleElement.textContent = chapter.name;
                chapterElement.appendChild(titleElement);

                // Verses Paragraph Container
                const paragraphElement = document.createElement('p');
                paragraphElement.className = 'chapter-text';

                // Loop through verses
                if (Array.isArray(chapter.text)) {
                    chapter.text.forEach(verse => {
                        const verseWrapper = document.createElement('span');
                        verseWrapper.className = 'verse';
                        verseWrapper.id = `${chapter.ID}.${verse.ID}`;

                        // Verse Number
                        const verseNum = document.createElement('sup');
                        verseNum.className = 'verse-number';
                        verseNum.textContent = verse.ID;

                        // Verse Content
                        const verseText = document.createTextNode(` ${verse.text} `);

                        verseWrapper.appendChild(verseNum);
                        verseWrapper.appendChild(verseText);
                        paragraphElement.appendChild(verseWrapper);
                    });
                }

                chapterElement.appendChild(paragraphElement);
                container.appendChild(chapterElement);
            });
        }

        // Initialize script execution when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            // Adjust this path relative to where index.html is located in your repo
            const defaultFilePath = 'BibleMapper_Data/1KI/ESV.json'; 
            
            loadScripture(defaultFilePath);
        });
    </script>
</body>
</html>
